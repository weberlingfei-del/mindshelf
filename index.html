<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Primary SEO Meta Tags -->
  <title>MindShelf | AI-Powered Digital Reading Journal & PKM Tool</title>
  <meta name="title" content="MindShelf | AI-Powered Digital Reading Journal">
  <meta name="description" content="Capture, organize, and refine your reading insights with MindShelf. A minimalist personal knowledge management tool with AI-driven insights for lifelong learners.">
  <meta name="keywords" content="reading notes, digital journal, AI reading assistant, personal knowledge management, PKM, book notes, study tool, Gemini AI">
  <meta name="author" content="MindShelf Team">
  <link rel="canonical" href="https://mindshelf.app" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mindshelf.app">
  <meta property="og:title" content="MindShelf - Your Intellectual Digital Garden">
  <meta property="og:description" content="Transform your reading into a structured knowledge base. Minimalist design, local storage, and AI insights.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&q=80&w=1200">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://mindshelf.app">
  <meta property="twitter:title" content="MindShelf - AI Reading Notes">
  <meta property="twitter:description" content="Capture your reading journey with beautiful rich text and AI-powered reflections.">
  <meta property="twitter:image" content="https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&q=80&w=1200">

  <!-- Structured Data (JSON-LD) for SEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "MindShelf",
    "operatingSystem": "Web",
    "applicationCategory": "ProductivityApplication",
    "description": "An AI-powered digital journal for reading notes and personal knowledge management.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "featureList": [
      "AI Insights via Gemini 3 Flash",
      "Rich Text Note Editing",
      "Local Storage Privacy",
      "Book Shelf Organization"
    ]
  }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-serif { font-family: 'Lora', serif; }
    
    /* Content Editable Placeholder */
    [contenteditable=true]:empty:before {
      content: attr(placeholder);
      color: #d1d1d6;
      font-style: italic;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #e4e4e7; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #d4d4d8; }
  </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body class="bg-zinc-50 text-zinc-900">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
